format:
  pdf:
    documentclass: scrreprt
    pdf-engine: xelatex
    papersize: a4
    toc: true
    toc-depth: 2
    number-sections: true
    colorlinks: true
    linkcolor: blue
    urlcolor: blue
    citecolor: blue
    fontsize: 10pt
    linestretch: 1.06
    geometry:
      - top=24mm
      - bottom=24mm
      - left=24mm
      - right=24mm
      - headheight=15pt
      - headsep=8mm
      - footskip=12mm
    keep-tex: true
    include-in-header: pdf-header.tex
