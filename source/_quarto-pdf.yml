book:
  title: "Kerja Matematika yang Dapat Ditelusuri"
  subtitle: "Pembaca Bahasa Indonesia - O017 / D120"
  author:
    - name: KokunoYumeto
  date: "2026-08-22"
  date-format: iso
  doi: "10.5281/zenodo.22060136"
  output-file: "kerja-matematika-yang-dapat-ditelusuri-id-2026.08.22.1"
  chapters:
    - index.qmd
    - units/01-membaca-argumen.qmd
    - units/02-menelusuri-sumber.qmd
