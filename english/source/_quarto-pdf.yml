project:
  type: book
  output-dir: ../output/pdf

book:
  title: "Traceable Mathematical Work"
  subtitle: "English-access edition - O017 / D120"
  author:
    - name: KokunoYumeto
  date: "2026-08-31"
  date-format: iso
  output-file: "traceable-mathematical-work-en-2026.08.31"
  chapters:
    - index.qmd
    - units/01-membaca-argumen.qmd
    - units/02-menelusuri-sumber.qmd
    - units/03-merekonstruksi-pembuktian.qmd
    - units/04-sitasi-provenance-catatan-sumber.qmd
    - units/05-eksposisi-matematika.qmd
    - units/06-komputasi-dapat-direproduksi.qmd
    - units/07-errata-koreksi-batas-kepastian.qmd
    - units/08-seminar-penelaah-tanggapan-kritik.qmd
    - units/09-kontribusi-komunitas-portofolio.qmd
    - wrapper/index.qmd

format:
  pdf:
    documentclass: scrreprt
    pdf-engine: xelatex
    papersize: a4
    toc: true
    toc-depth: 2
    number-sections: true
    colorlinks: true
    linkcolor: blue
    urlcolor: blue
    citecolor: blue
    fontsize: 10pt
    mainfont: DejaVuSerif
    mainfontoptions:
      - Path=fonts/
      - Extension=.ttf
      - UprightFont=*
      - BoldFont=*-Bold
      - ItalicFont=*-Italic
      - BoldItalicFont=*-BoldItalic
    monofont: DejaVuSansMono
    monofontoptions:
      - Path=fonts/
      - Extension=.ttf
      - UprightFont=*
      - BoldFont=*-Bold
      - ItalicFont=*-Oblique
      - BoldItalicFont=*-BoldOblique
    linestretch: 1.06
    geometry:
      - top=24mm
      - bottom=24mm
      - left=24mm
      - right=24mm
      - headheight=15pt
      - headsep=8mm
      - footskip=16mm
    keep-tex: true
    include-in-header: pdf-header.tex
